<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创意发散 · Creative Muse</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
</head>
<body>
  <!-- 暗色模式切换 -->
  <button id="theme-toggle" class="glass-btn theme-toggle" title="切换暗色模式">
    <span class="theme-icon-light">☀️</span>
    <span class="theme-icon-dark">🌙</span>
  </button>

  <!-- 历史记录抽屉触发器 -->
  <button id="history-toggle" class="glass-btn history-toggle" title="历史记录">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
  </button>

  <!-- 历史记录侧边抽屉 -->
  <div id="history-drawer" class="history-drawer glass-panel">
    <div class="drawer-header">
      <h3>历史记录</h3>
      <button id="drawer-close" class="glass-btn drawer-close" title="关闭">&times;</button>
    </div>
    <div id="history-list" class="history-list">
      <p class="history-empty">暂无历史记录</p>
    </div>
  </div>
  <div id="drawer-overlay" class="drawer-overlay"></div>

  <!-- 欢迎状态 -->
  <div id="welcome-state" class="welcome-state">
    <div class="welcome-content glass-panel">
      <h1>💡 创意发散</h1>
      <p>输入一个词，开启思维的无限联想</p>
    </div>
  </div>

  <!-- 输入区域 -->
  <div id="input-area" class="input-area">
    <div class="input-wrapper glass-panel">
      <input type="text" id="word-input" placeholder="输入一个创意种子词…" autocomplete="off" maxlength="50" />
      <button id="submit-btn" class="glass-btn submit-btn" title="发散联想">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 加载指示器 -->
  <div id="loading-indicator" class="loading-indicator glass-panel" style="display:none;">
    <div class="spinner"></div>
    <span>正在联想…</span>
  </div>

  <!-- 画布容器 -->
  <div id="canvas-container" class="canvas-container">
    <div id="transform-container" class="transform-container">
      <svg id="connections-svg" class="connections-svg"></svg>
      <div id="nodes-container" class="nodes-container"></div>
    </div>
  </div>

  <!-- 画布控件 -->
  <div id="canvas-controls" class="canvas-controls glass-panel">
    <button id="zoom-in" class="glass-btn control-btn" title="放大">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <span id="zoom-level" class="zoom-level">100%</span>
    <button id="zoom-out" class="glass-btn control-btn" title="缩小">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="zoom-fit" class="glass-btn control-btn" title="适应视图">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
    <button id="canvas-clear" class="glass-btn control-btn" title="清空画布">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4h8v2"/>
      </svg>
    </button>
  </div>

  <!-- 撤销提示 -->
  <div id="undo-toast" class="undo-toast glass-panel" style="display:none;">
    <span>Ctrl+Z 撤销</span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
